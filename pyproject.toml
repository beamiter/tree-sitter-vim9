[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-vim9"
description = "Vim9-first Tree-sitter grammar"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "beamiter", email = "beamiter@163.com" }]
keywords = ["incremental", "parsing", "tree-sitter", "vim", "vim9"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/beamiter/tree-sitter-vim9"
Issues = "https://github.com/beamiter/tree-sitter-vim9/issues"

[project.optional-dependencies]
core = ["tree-sitter>=0.25,<0.26"]
test = ["pytest>=8", "tree-sitter>=0.25,<0.26"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
