name: Refresh generated parser

on:
  push:
    branches: [agent/vim9-parser-evolution]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-vim9-generated
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/vim9-parser-evolution
          fetch-depth: 0

      - name: Apply repository upgrade
        id: upgrade
        continue-on-error: true
        run: python scripts/apply-v0.2-upgrade.py > /tmp/upgrade.log 2>&1
      - name: Upload bootstrap diagnostics
        if: steps.upgrade.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-error
          path: /tmp/upgrade.log
          if-no-files-found: error
      - name: Stop after bootstrap failure
        if: steps.upgrade.outcome == 'failure'
        run: |
          cat /tmp/upgrade.log
          exit 1

      - uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.25.10

      - name: Generate parser
        id: generate
        continue-on-error: true
        run: tree-sitter generate --abi 15 > /tmp/generate.log 2>&1
      - name: Upload generator diagnostics
        if: steps.generate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: generate-error
          path: |
            /tmp/generate.log
            grammar.js
          if-no-files-found: error
      - name: Stop after generator failure
        if: steps.generate.outcome == 'failure'
        run: |
          cat /tmp/generate.log
          exit 1

      - name: Update and run corpus tests
        id: corpus
        continue-on-error: true
        run: |
          tree-sitter test --update > /tmp/corpus.log 2>&1
          tree-sitter test >> /tmp/corpus.log 2>&1
      - name: Upload corpus diagnostics
        if: steps.corpus.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: corpus-error
          path: |
            /tmp/corpus.log
            test/corpus
          if-no-files-found: error
      - name: Stop after corpus failure
        if: steps.corpus.outcome == 'failure'
        run: |
          cat /tmp/corpus.log
          exit 1

      - name: Validate queries
        id: queries
        continue-on-error: true
        run: |
          tree-sitter build > /tmp/queries.log 2>&1
          node scripts/test-queries.mjs >> /tmp/queries.log 2>&1
      - name: Upload query diagnostics
        if: steps.queries.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: query-error
          path: |
            /tmp/queries.log
            queries
          if-no-files-found: error
      - name: Stop after query failure
        if: steps.queries.outcome == 'failure'
        run: |
          cat /tmp/queries.log
          exit 1

      - name: Commit upgraded repository
        id: commit
        continue-on-error: true
        run: |
          {
            set -x
            git status --short
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git status --short
            git commit -m "feat: evolve Vim9 grammar and bindings"
            git push origin HEAD:agent/vim9-parser-evolution
          } > /tmp/commit.log 2>&1
      - name: Upload commit diagnostics
        if: steps.commit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: commit-error
          path: /tmp/commit.log
          if-no-files-found: error
      - name: Stop after commit failure
        if: steps.commit.outcome == 'failure'
        run: |
          cat /tmp/commit.log
          exit 1
